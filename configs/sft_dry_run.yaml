# SFT dry-run config — validates the pipeline before committing GPU time.
method: sft
model:
  model_id: Qwen/Qwen3.5-0.8B
  use_qlora: false
  lora_r: 4
  lora_alpha: 8
data:
  train_path: data/train_sft
  max_length: null
training:
  output_dir: outputs/sft_dry_run
  per_device_train_batch_size: 1
  num_train_epochs: 1
  dry_run: true
  dry_run_steps: 2
  save_steps: 1
  save_total_limit: 2
  report_to: []
