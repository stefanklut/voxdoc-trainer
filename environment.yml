name: voxdoc-trainer
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pip
  - termcolor
  - python-dotenv
  - wandb
  - tensorboard
  - pytest
  - black
  - rich
  - sentencepiece
  - protobuf
  - pillow
  - pyyaml
  - pip:
      # torch/torchvision pinned to the exact versions vllm 0.29.0 requires
      # (torch==2.13.0, torchvision==0.28.0, torchaudio==2.11.0); unpinned,
      # pip picks torch 2.14.0 and backtracks vllm until resolution fails.
      # These resolve to the plain PyPI builds (CUDA 13.0). Do NOT add the
      # PyTorch cu132 index here: vllm's torchaudio==2.11.0 pin only exists as
      # a CUDA 13.0 build, and a CUDA 13.2 torch mixed with a CUDA 13.0
      # torchaudio raises a version-mismatch error on import.
      - torch==2.13.0
      - torchvision==0.28.0
      - transformers
      - vllm
      - trl
      - peft
      - accelerate
      - datasets
      - bitsandbytes
      - lm-eval
      - doclang[schematron-saxon]
